<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporizador Visual Inclusivo | TIC y Educación Especial</title>
  <style>
    :root {
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --primary: #0284c7;
      --text-color: #0f172a;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Verdana', 'Segoe UI', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    header p {
      font-size: 1.1rem;
      color: #475569;
    }

    .main-container {
      background: var(--card-bg);
      border: 4px solid var(--primary);
      border-radius: 28px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* CONTENEDOR DEL RELOJ CIRCULAR */
    .timer-display {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: conic-gradient(var(--primary) 0deg, #e2e8f0 0deg);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
      transition: background 0.2s linear;
    }

    .timer-inner {
      width: 190px;
      height: 190px;
      background: white;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .time-text {
      font-size: 2.8rem;
      font-weight: bold;
      color: var(--text-color);
    }

    .time-label {
      font-size: 1rem;
      color: #64748b;
      font-weight: bold;
    }

    /* CONTROLES DE TIEMPO PRESELECCIONADO */
    .preset-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .btn-preset {
      background-color: #e0f2fe;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-preset:hover, .btn-preset:focus {
      background-color: var(--primary);
      color: white;
      transform: scale(1.05);
    }

    /* CONTROLES PRINCIPALES */
    .controls {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-start { background-color: var(--accent-green); }
    .btn-reset { background-color: var(--accent-red); }

    .btn-action:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* MENSAJE DE FINALIZACIÓN */
    .finish-message {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-green);
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back {
      margin-top: 25px;
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      display: inline-block;
      padding: 10px 20px;
      background: white;
      border-radius: 12px;
      border: 2px solid var(--primary);
    }

    .btn-back:hover {
      background: var(--primary);
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <h1>⏳ Temporizador Visual Sensorial</h1>
    <p>Estructuración del tiempo y anticipación de actividades</p>
  </header>

  <main class="main-container">
    
    <!-- Reloj visual gráfico -->
    <div class="timer-display" id="timerCircle">
      <div class="timer-inner">
        <span class="time-text" id="timeDisplay">05:00</span>
        <span class="time-label" id="statusLabel">Tiempo restante</span>
      </div>
    </div>

    <div class="finish-message" id="finishMessage"></div>

    <!-- Botones de selección rápida -->
    <div class="preset-buttons">
      <button class="btn-preset" onclick="setTimer(1)">1 Min ⏱️</button>
      <button class="btn-preset" onclick="setTimer(3)">3 Min ⏱️</button>
      <button class="btn-preset" onclick="setTimer(5)">5 Min ⏱️</button>
      <button class="btn-preset" onclick="setTimer(10)">10 Min ⏱️</button>
    </div>

    <!-- Acciones de control -->
    <div class="controls">
      <button class="btn-action btn-start" id="startBtn" onclick="toggleTimer()">▶️ Iniciar</button>
      <button class="btn-action btn-reset" onclick="resetTimer()">🔄 Reiniciar</button>
    </div>

  </main>

  <a href="index.html" class="btn-back">⬅️ Volver al Portal Principal</a>

  <script>
    let totalSeconds = 300; // 5 minutos por defecto
    let remainingSeconds = 300;
    let timerInterval = null;
    let isRunning = false;

    const timeDisplay = document.getElementById('timeDisplay');
    const timerCircle = document.getElementById('timerCircle');
    const startBtn = document.getElementById('startBtn');
    const finishMessage = document.getElementById('finishMessage');

    function updateDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      // Actualización gráfica del círculo con gradiente cónico
      const percentage = (remainingSeconds / totalSeconds) * 360;
      timerCircle.style.background = `conic-gradient(var(--primary) ${percentage}deg, #e2e8f0 ${percentage}deg)`;
    }

    function setTimer(minutes) {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.textContent = '▶️ Iniciar';
      totalSeconds = minutes * 60;
      remainingSeconds = totalSeconds;
      finishMessage.textContent = '';
      updateDisplay();
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = '▶️ Continuar';
      } else {
        if (remainingSeconds <= 0) return;
        isRunning = true;
        startBtn.textContent = '⏸️ Pausar';
        timerInterval = setInterval(() => {
          remainingSeconds--;
          updateDisplay();

          if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = '▶️ Iniciar';
            finishTimer();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.textContent = '▶️ Iniciar';
      remainingSeconds = totalSeconds;
      finishMessage.textContent = '';
      updateDisplay();
    }

    function finishTimer() {
      finishMessage.textContent = '🎉 ¡Tiempo completado! Excelente trabajo.';
      
      // Respuesta auditiva mediante Voz de Síntesis
      if ('speechSynthesis' in window) {
        const mensaje = new SpeechSynthesisUtterance('El tiempo ha terminado. Muy bien hecho.');
        mensaje.lang = 'es-ES';
        window.speechSynthesis.speak(mensaje);
      }
    }

    // Inicializar reloj
    updateDisplay();
  </script>
</body>
</html>
