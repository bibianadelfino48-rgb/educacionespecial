<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablero de Comunicación Aumentativa (CAA)</title>
  <style>
    /* ==========================================
       VARIABLES DE COLOR (SISTEMA CAA)
       ========================================== */
    :root {
      --bg-main: #f0f4f8;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      
      /* Colores por tipo de palabra */
      --color-sujeto: #3b82f6;     /* Azul: Personas / Pronombres */
      --color-accion: #ef4444;     /* Rojo/Rosa: Verbos / Acciones */
      --color-necesidad: #f59e0b;  /* Amarillo/Naranja: Necesidades / Comida */
      --color-emocion: #10b981;    /* Verde: Estados de ánimo / Sentimientos */
      --color-social: #8b5cf6;     /* Violeta: Saludos / Social */
      
      --focus-ring: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Verdana', 'Segoe UI', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ENCABEZADO Y VISOR DE MENSAJE */
    header {
      width: 100%;
      max-width: 900px;
      margin-bottom: 25px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: #0f172a;
    }

    /* Franja donde se construye la oración */
    .visor-oracion {
      background-color: var(--card-bg);
      border: 4px solid #cbd5e1;
      border-radius: 16px;
      padding: 15px 20px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .mensaje-texto {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-dark);
      flex-grow: 1;
      text-align: left;
    }

    .btn-borrar {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-borrar:hover,
    .btn-borrar:focus {
      background-color: #334155;
      outline: 3px solid var(--focus-ring);
    }

    /* CUADRÍCULA DE PICTOGRAMAS (CSS GRID) */
    main {
      width: 100%;
      max-width: 900px;
    }

    .grid-tablero {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
    }

    /* BOTONES DE PICTOGRAMAS */
    .btn-pictograma {
      background-color: var(--card-bg);
      border: 4px solid #cbd5e1;
      border-radius: 18px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
    }

    /* Animación e indicador visual al pasar el cursor o enfocar con teclado */
    .btn-pictograma:hover,
    .btn-pictograma:focus {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.12);
    }

    .btn-pictograma:focus {
      outline: 4px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 8px;
      line-height: 1;
    }

    .etiqueta {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-dark);
      text-align: center;
    }

    /* BORDES POR CATEGORÍA CROMÁTICA */
    .cat-sujeto { border-color: var(--color-sujeto); }
    .cat-accion { border-color: var(--color-accion); }
    .cat-necesidad { border-color: var(--color-necesidad); }
    .cat-emocion { border-color: var(--color-emocion); }
    .cat-social { border-color: var(--color-social); }

    /* LEYENDA ACCESIBLE */
    footer {
      margin-top: 35px;
      text-align: center;
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO CON VISOR DE ORACIÓN -->
  <header>
    <h1>💬 Mi Tablero de Comunicación</h1>
    <div class="visor-oracion" aria-live="polite">
      <div class="mensaje-texto" id="pantalla-mensaje">Toca una opción...</div>
      <button class="btn-borrar" onclick="borrarMensaje()">Borrar ✕</button>
    </div>
  </header>

  <!-- REJILLA DE PICTOGRAMAS -->
  <main>
    <div class="grid-tablero" role="region" aria-label="Tablero de pictogramas">

      <!-- Personas / Sujetos (Borde Azul) -->
      <button class="btn-pictograma cat-sujeto" onclick="agregarTexto('Yo')">
        <span class="emoji" role="img" aria-label="Yo">🙋‍♂️</span>
        <span class="etiqueta">Yo</span>
      </button>

      <button class="btn-pictograma cat-sujeto" onclick="agregarTexto('Quiero')">
        <span class="emoji" role="img" aria-label="Quiero">👉</span>
        <span class="etiqueta">Quiero</span>
      </button>

      <!-- Acciones / Verbos (Borde Rojo) -->
      <button class="btn-pictograma cat-accion" onclick="agregarTexto('Comer')">
        <span class="emoji" role="img" aria-label="Comer">🍽️</span>
        <span class="etiqueta">Comer</span>
      </button>

      <button class="btn-pictograma cat-accion" onclick="agregarTexto('Tomar')">
        <span class="emoji" role="img" aria-label="Tomar agua">🥤</span>
        <span class="etiqueta">Tomar</span>
      </button>

      <button class="btn-pictograma cat-accion" onclick="agregarTexto('Jugar')">
        <span class="emoji" role="img" aria-label="Jugar">🧩</span>
        <span class="etiqueta">Jugar</span>
      </button>

      <!-- Necesidades (Borde Amarillo) -->
      <button class="btn-pictograma cat-necesidad" onclick="agregarTexto('Ir al baño')">
        <span class="emoji" role="img" aria-label="Baño">WC</span>
        <span class="etiqueta">Baño</span>
      </button>

      <button class="btn-pictograma cat-necesidad" onclick="agregarTexto('Ayuda')">
        <span class="emoji" role="img" aria-label="Ayuda">🆘</span>
        <span class="etiqueta">Ayuda</span>
      </button>

      <!-- Emociones (Borde Verde) -->
      <button class="btn-pictograma cat-emocion" onclick="agregarTexto('Feliz')">
        <span class="emoji" role="img" aria-label="Feliz">😊</span>
        <span class="etiqueta">Feliz</span>
      </button>

      <button class="btn-pictograma cat-emocion" onclick="agregarTexto('Cansado')">
        <span class="emoji" role="img" aria-label="Cansado">😴</span>
        <span class="etiqueta">Cansado</span>
      </button>

      <!-- Social / Saludos (Borde Violeta) -->
      <button class="btn-pictograma cat-social" onclick="agregarTexto('Hola')">
        <span class="emoji" role="img" aria-label="Hola">👋</span>
        <span class="etiqueta">Hola</span>
      </button>

      <button class="btn-pictograma cat-social" onclick="agregarTexto('Gracias')">
        <span class="emoji" role="img" aria-label="Gracias">🙏</span>
        <span class="etiqueta">Gracias</span>
      </button>

    </div>
  </main>

  <footer>
    <p>Diseñado con criterios de Comunicación Aumentativa y Alternativa (CAA) y accesibilidad web.</p>
  </footer>

  <!-- LÓGICA DE INTERACCIÓN SIMPLE -->
  <script>
    let oracion = [];

    function agregarTexto(palabra) {
      oracion.push(palabra);
      actualizarPantalla();
    }

    function borrarMensaje() {
      oracion = [];
      actualizarPantalla();
    }

    function actualizarPantalla() {
      const pantalla = document.getElementById('pantalla-mensaje');
      if (oracion.length === 0) {
        pantalla.textContent = "Toca una opción...";
        pantalla.style.color = "#94a3b8";
      } else {
        pantalla.textContent = oracion.join(" ");
        pantalla.style.color = "#1e293b";
      }
    }
  </script>

</body>
</html>
